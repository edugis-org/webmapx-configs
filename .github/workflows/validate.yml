name: validate configs

on:
  push:
  pull_request:
  # So a run can be started by hand after webmapx changes, without an empty commit.
  workflow_dispatch:
  # Weekly, because these configs can also break without anyone touching them:
  # webmapx's main branch moves underneath them.
  schedule:
    - cron: '0 6 * * 1'

jobs:
  validate:
    runs-on: ubuntu-latest

    # The matrix is the point of this workflow. A config naming a tool that
    # only exists in main passes there and fails against the released version,
    # which tells you what it actually is: not a typo, but a config that has
    # run ahead of the code. Validated against one version, both look the same
    # — which is to say they look like nothing, since webmapx skips what it
    # does not recognise and carries on.
    # Two sources, deliberately, because they answer different questions and
    # neither replaces the other. A released version comes from npm: it is the
    # artifact deployments actually install, and it cannot be rewritten. `main`
    # comes from a git checkout, because "what is coming" is never published —
    # publishing per push would be absurd, and `ref` also takes any commit sha.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            ref: main
          - name: '0.2.3'
            npm: '0.2.3'

    name: webmapx@${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check out webmapx (${{ matrix.ref }})
        if: matrix.ref
        uses: actions/checkout@v4
        with:
          repository: edugis-org/webmapx
          ref: ${{ matrix.ref }}
          path: webmapx-checkout

      - name: Build the validator from source
        if: matrix.ref
        working-directory: webmapx-checkout
        # The postinstall downloads a browser for webmapx's own UI tests, which
        # this job has no use for.
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts
          npm run build:lib

      - name: Install webmapx ${{ matrix.npm }} from npm
        if: matrix.npm
        # --ignore-scripts for the same reason, and the published package
        # already contains the built dist-lib.
        run: npm install --no-save --ignore-scripts "@edugis-org/webmapx@${{ matrix.npm }}"

      - name: Validate every config
        env:
          WEBMAPX_VALIDATE: ${{ matrix.ref && format('{0}/webmapx-checkout/dist-lib/webmapx-validate.js', github.workspace) || '' }}
        run: npm run validate
